; Waveshare ESP32-S3-Touch-AMOLED-1.75C (ESP32-S3R8: 8 MB PSRAM octal, 32 MB flash)
[env:amoled175c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
monitor_speed = 115200
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    bblanchon/ArduinoJson@^7.2.0
    olikraus/U8g2@^2.36.5
    lewisxhe/SensorLib@0.3.1
    lewisxhe/XPowersLib@0.2.6
