<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Claude Code</title>
<style>
  :root { --fondo:#0b0d12; --tinta:#e8eaf0; --tenue:#8a90a2; --verde:#3ddc84; --ambar:#ffb020; --rojo:#ff4d5e; --azul:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; gap:40px; align-items:center; justify-content:center; flex-wrap:wrap;
         background:#1a1d24; color:var(--tinta); font:14px/1.35 -apple-system, "SF Pro Text", system-ui, sans-serif; padding:24px; }
  /* Simulación de la AMOLED redonda 466x466 */
  .pantalla { width:466px; height:466px; border-radius:50%; background:var(--fondo); position:relative; overflow:hidden;
              box-shadow:0 0 0 10px #2a2e37, 0 0 0 12px #3a3f4a, 0 20px 60px #0008; }
  .pantalla.alerta { animation:pulso 1s ease-in-out infinite; }
  @keyframes pulso { 50% { box-shadow:0 0 0 10px var(--ambar), 0 0 0 12px #3a3f4a, 0 0 60px var(--ambar); } }
  svg.anillo { position:absolute; inset:0; }
  .centro { position:absolute; inset:58px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .cifra { font-size:13px; color:var(--tenue); margin-top:14px; }
  .cifra b { color:var(--tinta); font-size:22px; font-weight:600; display:block; }
  .lista { margin-top:12px; width:300px; display:flex; flex-direction:column; gap:6px; }
  .ses { display:flex; align-items:center; gap:8px; background:#151922; border-radius:10px; padding:6px 10px; text-align:left; }
  .punto { width:10px; height:10px; border-radius:50%; flex:none; }
  .trabajando .punto { background:var(--verde); box-shadow:0 0 8px var(--verde); }
  .en_espera .punto { background:#4a5060; }
  .permiso { background:#3a2a08; }
  .permiso .punto { background:var(--ambar); box-shadow:0 0 10px var(--ambar); }
  .ses .txt { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:1; }
  .ses .sub { color:var(--tenue); font-size:11px; }
  .ses .tk { color:var(--tenue); font-size:11px; flex:none; }
  .aviso { position:absolute; left:0; right:0; bottom:46px; text-align:center; color:var(--ambar); font-weight:600; font-size:13px; padding:0 80px; }
  /* Columna de detalle (solo para la vista de escritorio) */
  .detalle { width:420px; background:#11141a; border-radius:14px; padding:18px; }
  .detalle h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--tenue); margin:14px 0 8px; }
  .detalle h2:first-child { margin-top:0; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td { padding:3px 0; } td:last-child { text-align:right; }
  .al { font-size:12px; padding:4px 0; border-bottom:1px solid #1e2330; }
  .al .h { color:var(--tenue); margin-right:6px; }
  .err { color:var(--rojo); }
</style>
</head>
<body>
  <div class="pantalla" id="pantalla">
    <svg class="anillo" viewBox="0 0 466 466">
      <circle cx="233" cy="233" r="218" fill="none" stroke="#1d2230" stroke-width="14"/>
      <circle id="arco" cx="233" cy="233" r="218" fill="none" stroke="var(--azul)" stroke-width="14"
              stroke-linecap="round" transform="rotate(-90 233 233)" stroke-dasharray="0 9999"/>
    </svg>
    <div class="centro">
      <div class="cifra"><b id="pct">–</b>ventana 5 h · <span id="libera"></span></div>
      <div class="lista" id="lista"></div>
    </div>
    <div class="aviso" id="aviso"></div>
  </div>

  <div class="detalle">
    <h2>Tokens</h2>
    <table id="tabla"></table>
    <h2>Últimas alertas</h2>
    <div id="alertas"></div>
    <h2>Estado</h2>
    <div id="estado" class="sub"></div>
  </div>

<script>
const C = 2 * Math.PI * 218;
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+' M' : n >= 1e3 ? (n/1e3).toFixed(0)+' k' : String(n);
const hora = ts => new Date(ts*1000).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ultimaAlerta = null;

function pitido() {
  try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain();
        o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .15); } catch (e) {}
}

async function refrescar() {
  try {
    const r = await fetch('/api/estado' + location.search, {cache:'no-store'});
    const d = await r.json();
    const m = d.tokens.medidor, pct = Math.min(m.pct ?? 0, 100);
    const arco = document.getElementById('arco');
    arco.setAttribute('stroke-dasharray', `${C*pct/100} ${C}`);
    arco.setAttribute('stroke', pct >= 90 ? 'var(--rojo)' : pct >= 70 ? 'var(--ambar)' : 'var(--azul)');
    document.getElementById('pct').textContent = m.pct == null ? fmt(m.usado) : `${m.pct}%`;
    const ms = d.tokens.medidor_semana;
    document.getElementById('libera').textContent =
      (m.reinicia ? `reinicia ${m.reinicia.split(' ').pop()}` : 'sin sesión') + ` · semana ${ms.pct}%`;

    document.getElementById('lista').innerHTML = d.sesiones.slice(0, 5).map(s => `
      <div class="ses ${s.estado}">
        <span class="punto"></span>
        <div class="txt">${esc(s.nombre || s.proyecto)}<div class="sub">${esc(s.proyecto)} · ${esc(s.origen)}</div></div>
        <span class="tk">${fmt(s.tokens.salida)} out</span>
      </div>`).join('') || '<div class="sub">Sin sesiones abiertas</div>';

    const pend = d.sesiones.filter(s => s.estado === 'permiso');
    document.getElementById('pantalla').classList.toggle('alerta', pend.length > 0);
    document.getElementById('aviso').textContent = pend.length ? `${pend.length} sesión(es) piden permiso` : '';
    if (ultimaAlerta !== null && d.n_alerta > ultimaAlerta) pitido();
    ultimaAlerta = d.n_alerta;

    const v = d.tokens.ventana_5h, h = d.tokens.hoy, w = d.tokens.semana;
    const th = t => `<td style="color:var(--tenue);text-align:right">${t}</td>`;
    const td = x => `<td style="text-align:right">${x}</td>`;
    document.getElementById('tabla').innerHTML = `
      <tr><td></td>${th('sesión')}${th('hoy')}${th('semana')}</tr>
      ${['entrada','cache_escritura','cache_lectura','salida'].map(k =>
        `<tr><td>${k.replace('_',' ')}</td>${td(fmt(v[k]))}${td(fmt(h[k]))}${td(fmt(w[k]))}</tr>`).join('')}
      <tr><td>mensajes</td>${td(v.mensajes)}${td(h.mensajes)}${td(w.mensajes)}</tr>
      <tr><td>medidor</td>${td(fmt(m.usado)+' / '+fmt(m.limite))}<td></td>${td(fmt(ms.usado)+' / '+fmt(ms.limite))}</tr>`;
    document.getElementById('alertas').innerHTML = d.alertas.map(a =>
      `<div class="al"><span class="h">${hora(a.ts)}</span>${esc(a.tipo)} · ${esc(a.mensaje)}</div>`).join('') || '<div class="sub">Ninguna</div>';
    document.getElementById('estado').textContent =
      `${d.conteo.total} sesiones · ${d.conteo.trabajando} trabajando · ${d.conteo.permiso} con permiso pendiente · actualizado ${hora(d.generado)}`;
  } catch (e) {
    document.getElementById('estado').innerHTML = '<span class="err">Sin conexión con el servidor</span>';
  }
}
refrescar(); setInterval(refrescar, 1000);
</script>
</body>
</html>
